<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon Pokédex</title>
<script src="pokemon-data.js"></script>
<style>
:root{
  --red:#d32f3f; --red-d:#9e1a2a; --bg:#f3efe6; --card:#fff; --ink:#22252e; --mute:#8a8f9c;
  --line:#e2ddd0; --ok:#2e9e5b; --shadow:0 2px 6px rgba(30,20,10,.12);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1c1e25;--card:#272a33;--ink:#eceef3;--mute:#8d93a3;--line:#383c48;--shadow:0 2px 8px rgba(0,0,0,.4)}
}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:20;background:var(--red);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 16px;max-width:1400px;margin:0 auto}
h1{font-size:20px;margin:0;display:flex;align-items:center;gap:8px;letter-spacing:.3px}
.ball{width:22px;height:22px;border-radius:50%;background:linear-gradient(#fff 0 0) center/100% 3px no-repeat,linear-gradient(#e33 50%,#fff 50%);border:2px solid #222;position:relative;flex:none}
.ball:after{content:"";position:absolute;inset:50% auto auto 50%;width:7px;height:7px;margin:-3.5px;border-radius:50%;background:#fff;border:2px solid #222}
.count{font-weight:600;margin-left:auto}
.prog{flex-basis:100%;height:6px;background:rgba(0,0,0,.25);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:#ffd84d;transition:width .3s}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1 1 400px}
input[type=search],select,.tools input{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px}
button:hover{filter:brightness(.96)}
button.primary{background:#ffd84d;color:#3a2c00;border-color:#d9b52a;font-weight:600}
button.danger{color:#c0283a}
header button{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.14);color:#fff}
header button.primary{background:#ffd84d;color:#3a2c00}
main{max-width:1400px;margin:0 auto;padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.slot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 10px;text-align:center;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s;position:relative;content-visibility:auto;contain-intrinsic-size:170px 160px}
.slot:hover{transform:translateY(-3px)}
.slot .num{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums;text-align:left}
.slot .pic{height:104px;display:grid;place-items:center}
.slot img{max-width:100%;max-height:104px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.slot .name{font-weight:600;font-size:13.5px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot.empty .pic{opacity:.28}
.slot.empty .name{color:var(--mute);font-weight:500}
.slot.empty .pic:before{content:"";width:58px;height:58px;border-radius:50%;border:3px dashed var(--mute);display:block}
.slot.empty:hover .pic{opacity:.6}
.slot.done:after{content:"✓";position:absolute;top:6px;right:8px;color:var(--ok);font-weight:700;font-size:14px}
.empty-msg{padding:60px;text-align:center;color:var(--mute)}

dialog{border:none;border-radius:18px;padding:0;max-width:min(900px,95vw);width:100%;background:var(--card);color:var(--ink);box-shadow:0 10px 50px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,10,20,.6)}
.m{display:grid;grid-template-columns:1fr 1fr;gap:0}
@media(max-width:700px){.m{grid-template-columns:1fr}}
.m .left{padding:18px;background:var(--bg)}
.m .right{padding:18px;display:flex;flex-direction:column;gap:12px}
.drop{border:2px dashed var(--mute);border-radius:14px;min-height:300px;display:grid;place-items:center;text-align:center;color:var(--mute);padding:10px;position:relative;
  background:repeating-conic-gradient(#0000000d 0 25%,#0000 0 50%) 0 0/20px 20px}
.drop.over{border-color:var(--red);color:var(--red)}
.drop canvas{max-width:100%;max-height:340px;display:none;filter:drop-shadow(0 3px 5px rgba(0,0,0,.4))}
.drop.has canvas{display:block}.drop.has .hint{display:none}
.drop .hint b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}
label.row{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
label.row span b{color:var(--ink);float:right}
input[type=range]{width:100%;accent-color:var(--red)}
select[size]{height:190px;padding:4px}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:auto;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--mute)}
.warn{color:#c47a00}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1><span class="ball"></span> Mon Pokédex</h1>
    <div class="tools">
      <input type="search" id="q" placeholder="Rechercher nom ou numéro…">
      <select id="gen"><option value="0">Toutes générations</option></select>
      <select id="st"><option value="all">Tous</option><option value="have">Obtenus</option><option value="miss">Manquants</option></select>
      <button class="primary" id="add">＋ Ajouter une image</button>
      <button id="exp" title="Sauvegarder ta collection dans un fichier">⬇ Sauvegarde</button>
      <button id="imp" title="Restaurer une sauvegarde">⬆ Restaurer</button>
      <input type="file" id="impf" accept=".json" hidden>
    </div>
    <div class="count" id="count"></div>
    <div class="prog"><i id="bar"></i></div>
  </div>
</header>
<main><div class="grid" id="grid"></div><div class="empty-msg" id="none" hidden>Aucun Pokémon ne correspond.</div></main>

<dialog id="dlg">
  <div class="m">
    <div class="left">
      <div class="drop" id="drop">
        <div class="hint"><b>Dépose ton image ici</b>ou clique pour parcourir · ou colle avec Ctrl+V<br><small>(Pokémon sur fond blanc/papier)</small></div>
        <canvas id="prev"></canvas>
      </div>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
    <div class="right">
      <div>
        <input type="search" id="pq" placeholder="Chercher le Pokémon…" style="width:100%;margin-bottom:6px">
        <select id="psel" size="6" style="width:100%"></select>
        <div class="note warn" id="over" hidden>Ce slot contient déjà une image : elle sera remplacée.</div>
      </div>
      <label class="row"><span>Tolérance du fond <b id="vtol"></b></span><input type="range" id="tol" min="5" max="120" value="38"></label>
      <label class="row"><span>Contour sticker <b id="vbor"></b></span><input type="range" id="bor" min="0" max="40" value="14"></label>
      <label class="row"><span>Affiner les bords <b id="vero"></b></span><input type="range" id="ero" min="0" max="5" value="1"></label>
      <div class="note">Si le fond n'est pas entièrement retiré, augmente la tolérance ; si le Pokémon est mangé, diminue-la.</div>
      <div class="actions">
        <button class="danger" id="del" hidden>Supprimer</button>
        <button id="cancel">Annuler</button>
        <button class="primary" id="save" disabled>Enregistrer</button>
      </div>
    </div>
  </div>
</dialog>

<script>
const P = window.POKEMON; // [id, nomFR, nomEN, gen]
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(4, '0');

/* ---------- Stockage (IndexedDB) ---------- */
const db = new Promise((res, rej) => {
  const r = indexedDB.open('pokedex', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('stickers');
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const tx = async (mode, fn) => { const d = await db; return new Promise((res, rej) => {
  const t = d.transaction('stickers', mode), s = t.objectStore('stickers'); const out = fn(s);
  t.oncomplete = () => res(out.result); t.onerror = () => rej(t.error); }); };
const store = { // id -> {blob,url}
  items: new Map(),
  async load() {
    const d = await db;
    await new Promise(res => { const c = d.transaction('stickers').objectStore('stickers').openCursor();
      c.onsuccess = () => { const cur = c.result; if (!cur) return res(); this.set(+cur.key, cur.value, false); cur.continue(); }; });
  },
  set(id, blob) { this.drop(id, false); this.items.set(id, { blob, url: URL.createObjectURL(blob) }); },
  drop(id) { const o = this.items.get(id); if (o) URL.revokeObjectURL(o.url); this.items.delete(id); }
};
const put = (id, blob) => tx('readwrite', s => s.put(blob, id)).then(() => store.set(id, blob));
const remove = id => tx('readwrite', s => s.delete(id)).then(() => store.drop(id));

/* ---------- Grille ---------- */
const GEN = ['I','II','III','IV','V','VI','VII','VIII','IX'];
GEN.forEach((g, i) => $('#gen').insertAdjacentHTML('beforeend', `<option value="${i+1}">Génération ${g}</option>`));
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const cards = new Map();
function buildGrid() {
  const frag = document.createDocumentFragment();
  for (const [id, fr, en, gen] of P) {
    const el = document.createElement('div');
    el.className = 'slot empty'; el.dataset.id = id;
    el.innerHTML = `<div class="num">#${pad(id)}</div><div class="pic"></div><div class="name">${fr}</div>`;
    el.title = fr === en ? fr : `${fr} (${en})`;
    el.onclick = () => openDialog(id);
    cards.set(id, { el, key: norm(fr + ' ' + en + ' ' + id + ' ' + pad(id)), gen });
    frag.appendChild(el);
  }
  $('#grid').appendChild(frag);
}
function paint(id) {
  const c = cards.get(id), it = store.items.get(id), pic = c.el.querySelector('.pic');
  pic.innerHTML = '';
  if (it) { const im = new Image(); im.src = it.url; im.loading = 'lazy'; im.decoding = 'async'; im.alt = ''; pic.appendChild(im); }
  c.el.classList.toggle('empty', !it); c.el.classList.toggle('done', !!it);
}
function refresh() {
  const q = norm($('#q').value.trim()), g = +$('#gen').value, st = $('#st').value; let shown = 0;
  for (const [id, c] of cards) {
    const have = store.items.has(id);
    const ok = (!q || c.key.includes(q)) && (!g || c.gen === g) && (st === 'all' || (st === 'have') === have);
    c.el.hidden = !ok; shown += ok;
  }
  $('#none').hidden = shown > 0;
  const n = store.items.size;
  $('#count').textContent = `${n} / ${P.length}`;
  $('#bar').style.width = (100 * n / P.length) + '%';
}
['q','gen','st'].forEach(i => $('#'+i).addEventListener('input', refresh));

/* ---------- Détourage + effet sticker ---------- */
const MAXW = 640;
function loadImage(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; }); }

function cutout(img, tol, erodeN) {
  const sc = Math.min(1, MAXW / Math.max(img.naturalWidth, img.naturalHeight));
  const w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const cx = cv.getContext('2d', { willReadFrequently: true });
  cx.fillStyle = '#fff'; cx.fillRect(0, 0, w, h); cx.drawImage(img, 0, 0, w, h);
  const id = cx.getImageData(0, 0, w, h), d = id.data, N = w * h;

  // couleur du fond = médiane du pourtour
  const rs = [], gs = [], bs = [];
  const sample = (x, y) => { const k = (y * w + x) * 4; rs.push(d[k]); gs.push(d[k+1]); bs.push(d[k+2]); };
  for (let x = 0; x < w; x++) { sample(x, 0); sample(x, h-1); }
  for (let y = 0; y < h; y++) { sample(0, y); sample(w-1, y); }
  const med = a => a.sort((x, y) => x - y)[a.length >> 1];
  const br = med(rs), bg = med(gs), bb = med(bs), t2 = tol * tol;

  // flood fill depuis les bords (fond = 1)
  const bgm = new Uint8Array(N), st = new Int32Array(N); let sp = 0;
  const isBg = p => { const k = p * 4, dr = d[k]-br, dg = d[k+1]-bg, db = d[k+2]-bb; return dr*dr + dg*dg + db*db <= t2; };
  const push = p => { if (!bgm[p] && isBg(p)) { bgm[p] = 1; st[sp++] = p; } };
  for (let x = 0; x < w; x++) { push(x); push((h-1)*w + x); }
  for (let y = 0; y < h; y++) { push(y*w); push(y*w + w-1); }
  while (sp) {
    const p = st[--sp], x = p % w;
    if (x > 0) push(p-1); if (x < w-1) push(p+1); if (p >= w) push(p-w); if (p < N-w) push(p+w);
  }

  // garder uniquement les composantes significatives (retire poussières/ombres isolées)
  const lab = new Int32Array(N); const sizes = [0]; let nl = 0;
  for (let s = 0; s < N; s++) {
    if (bgm[s] || lab[s]) continue;
    nl++; let cnt = 0; lab[s] = nl; st[sp++] = s;
    while (sp) { const p = st[--sp]; cnt++; const x = p % w;
      const v = q => { if (!bgm[q] && !lab[q]) { lab[q] = nl; st[sp++] = q; } };
      if (x > 0) v(p-1); if (x < w-1) v(p+1); if (p >= w) v(p-w); if (p < N-w) v(p+w); }
    sizes.push(cnt);
  }
  const maxS = Math.max(0, ...sizes);
  let m = new Uint8Array(N);
  for (let p = 0; p < N; p++) m[p] = (!bgm[p] && sizes[lab[p]] >= maxS * 0.02) ? 1 : 0;

  // érosion (retire le liseré clair des bords)
  for (let k = 0; k < erodeN; k++) {
    const o = new Uint8Array(N);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const p = y*w + x;
      o[p] = m[p] && x>0 && x<w-1 && y>0 && y<h-1 && m[p-1] && m[p+1] && m[p-w] && m[p+w] ? 1 : 0; }
    m = o;
  }
  // lissage -> alpha
  const a = new Float32Array(N);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { let s = 0, c = 0;
    for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) { const X = x+i, Y = y+j;
      if (X >= 0 && X < w && Y >= 0 && Y < h) { s += m[Y*w + X]; c++; } }
    a[y*w + x] = m[y*w + x] ? Math.min(1, s / c * 1.3) : s / c * 0.6; }
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) { const p = y*w + x;
    d[p*4+3] = Math.round(a[p] * 255);
    if (a[p] > 0.5) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; } }
  if (x1 < 0) return null;
  cx.putImageData(id, 0, 0);
  return { cv, box: [x0, y0, x1 - x0 + 1, y1 - y0 + 1] };
}

function sticker(co, border) {
  const [bx, by, bw, bh] = co.box, pd = border + 6;
  const W = bw + pd*2, H = bh + pd*2;
  const out = document.createElement('canvas'); out.width = W; out.height = H;
  const o = out.getContext('2d');
  // silhouette teintée
  const tint = col => { const t = document.createElement('canvas'); t.width = W; t.height = H;
    const c = t.getContext('2d'); c.drawImage(co.cv, bx, by, bw, bh, pd, pd, bw, bh);
    c.globalCompositeOperation = 'source-in'; c.fillStyle = col; c.fillRect(0, 0, W, H); return t; };
  const stamp = (t, r) => { if (r <= 0) { o.drawImage(t, 0, 0); return; }
    const n = Math.min(160, Math.max(24, Math.ceil(r * 6)));
    for (let k = 0; k < n; k++) { const an = k / n * Math.PI * 2; o.drawImage(t, Math.cos(an)*r, Math.sin(an)*r); }
    for (let rr = r / 2; rr > 1; rr /= 2) for (let k = 0; k < 16; k++) { const an = k / 16 * Math.PI * 2; o.drawImage(t, Math.cos(an)*rr, Math.sin(an)*rr); }
    o.drawImage(t, 0, 0); };
  if (border > 0) { stamp(tint('#c9ced8'), border + 1.8); stamp(tint('#ffffff'), border); }
  o.drawImage(co.cv, bx, by, bw, bh, pd, pd, bw, bh);
  return out;
}

/* ---------- Boîte de dialogue ---------- */
const dlg = $('#dlg'); let curImg = null, curId = null, timer = 0, lastCanvas = null;
function fillList() {
  const q = norm($('#pq').value.trim()); const sel = $('#psel'); const keep = curId;
  sel.innerHTML = '';
  for (const [id, fr, en] of P) {
    if (q && !cards.get(id).key.includes(q)) continue;
    const o = new Option(`#${pad(id)}  ${fr}${store.items.has(id) ? '  ✓' : ''}`, id);
    sel.add(o);
  }
  if (keep && sel.querySelector(`option[value="${keep}"]`)) sel.value = keep;
  else if (q && sel.options.length) { sel.selectedIndex = 0; curId = +sel.value; }
  upd();
}
function upd() {
  curId = $('#psel').value ? +$('#psel').value : curId;
  const has = curId && store.items.has(curId);
  $('#over').hidden = !has; $('#del').hidden = !has;
  $('#save').disabled = !(lastCanvas && curId);
}
function renderPreview() {
  $('#vtol').textContent = $('#tol').value; $('#vbor').textContent = $('#bor').value + ' px'; $('#vero').textContent = $('#ero').value;
  if (!curImg) return;
  clearTimeout(timer);
  timer = setTimeout(() => {
    const co = cutout(curImg, +$('#tol').value, +$('#ero').value);
    if (!co) { lastCanvas = null; upd(); return; }
    lastCanvas = sticker(co, +$('#bor').value);
    const p = $('#prev'); p.width = lastCanvas.width; p.height = lastCanvas.height;
    p.getContext('2d').drawImage(lastCanvas, 0, 0);
    $('#drop').classList.add('has'); upd();
  }, 40);
}
async function setFile(f) {
  if (!f || !f.type.startsWith('image/')) return;
  const url = URL.createObjectURL(f);
  try { curImg = await loadImage(url); } finally { URL.revokeObjectURL(url); }
  renderPreview();
}
function openDialog(id) {
  curId = id || null; curImg = null; lastCanvas = null;
  $('#drop').classList.remove('has'); $('#pq').value = ''; $('#file').value = '';
  fillList(); renderPreview(); dlg.showModal();
}
$('#add').onclick = () => openDialog(null);
$('#cancel').onclick = () => dlg.close();
$('#drop').onclick = () => $('#file').click();
$('#file').onchange = e => setFile(e.target.files[0]);
$('#drop').addEventListener('dragover', e => { e.preventDefault(); $('#drop').classList.add('over'); });
$('#drop').addEventListener('dragleave', () => $('#drop').classList.remove('over'));
$('#drop').addEventListener('drop', e => { e.preventDefault(); $('#drop').classList.remove('over'); setFile(e.dataTransfer.files[0]); });
document.addEventListener('paste', e => { if (dlg.open) { const f = [...e.clipboardData.files].find(f => f.type.startsWith('image/')); if (f) setFile(f); } });
$('#pq').oninput = () => { curId = null; fillList(); };
$('#psel').onchange = () => { curId = +$('#psel').value; upd(); };
['tol','bor','ero'].forEach(i => $('#'+i).addEventListener('input', renderPreview));
$('#save').onclick = async () => {
  if (!lastCanvas || !curId) return;
  const blob = await new Promise(r => lastCanvas.toBlob(r, 'image/webp', .92));
  const b = blob && blob.type === 'image/webp' ? blob : await new Promise(r => lastCanvas.toBlob(r, 'image/png'));
  await put(curId, b); paint(curId); refresh(); dlg.close();
  const el = cards.get(curId).el; el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
};
$('#del').onclick = async () => {
  if (!curId || !confirm('Supprimer cette image ?')) return;
  await remove(curId); paint(curId); refresh(); dlg.close();
};

/* ---------- Sauvegarde / restauration ---------- */
const b2d = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
$('#exp').onclick = async () => {
  const o = {}; for (const [id, it] of store.items) o[id] = await b2d(it.blob);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify({ v: 1, stickers: o })], { type: 'application/json' }));
  a.download = 'pokedex-sauvegarde.json'; a.click();
};
$('#imp').onclick = () => $('#impf').click();
$('#impf').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const j = JSON.parse(await f.text()); let n = 0;
    for (const [id, url] of Object.entries(j.stickers || {})) { await put(+id, await (await fetch(url)).blob()); paint(+id); n++; }
    refresh(); alert(n + ' image(s) restaurée(s).');
  } catch (err) { alert('Fichier invalide.'); }
  e.target.value = '';
};

/* ---------- Démarrage ---------- */
buildGrid();
store.load().then(() => { for (const id of store.items.keys()) paint(id); refresh(); });
refresh();
</script>
</body>
</html>
